<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Document</title>
</head>
<body>
    <h1>Mis Habilidades</h1>
    <button type="button" th:onclick="|window.location.href='@{/skills/new}'|">Nuevo</button>
    <p th:if="${skills.isEmpty()}">No hay datos</p>
    <ul th:if="${!skills.isEmpty()}">
        <li th:each="skill, stat : ${skills}">
            <span th:text="'Habilidad: ' + ${skill.name} + ' Nivel: ' + ${skill.level}"></span>
            <a th:href="@{'/skills/id/' + ${stat.index}}">Ver detalle</a>
            <span th:text="${stat.count}"></span>
            <span th:text="${stat.size}"></span>
            <span th:if="${stat.first}">(Primera)</span>
            <span th:if="${stat.last}">(Última)</span>
            <span th:if="${stat.even}">[Par]</span>
            <span th:if="${stat.odd}">[Impar]</span>
        </li>
    </ul>
    <p th:if="${filterMessage}" th:text="${filterMessage}"></p>

    <form th:action="@{/skills}" method="GET">
        <label for="filter">Buscar</label>
        <input type="text" id="filter" th:value="${filter}" name="filter" required>
        <button type="submit">Buscar</button>
    </form>
</body>
</html>
